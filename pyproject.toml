[project]
name = "paramiko-tutorial"
version = "0.1.0"
description = "Automate tasks on a remote host with Python using Paramiko and SCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "paramiko",
    "scp",
    "loguru",
]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "mypy",
    "black",
    "isort",
    "flake8",
    "pylint",
]

[project.urls]
Homepage = "https://hackersandslackers.com/automate-ssh-scp-python-paramiko/"
Repository = "https://github.com/sundonglai03/paramiko-tutorial"
Issues = "https://github.com/sundonglai03/paramiko-tutorial/issues"

[tool.pylint."MESSAGES CONTROL"]
disable = "C0103,C0301,W0703,W0621"
