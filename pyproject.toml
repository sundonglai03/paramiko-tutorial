[project]
name = "ssh-tool"
version = "0.1.0"
description = "SSH remote automation tooling with Python client support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "paramiko",
    "scp",
    "loguru",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "mypy",
    "black",
    "isort",
    "flake8",
    "pylint",
]

[project.urls]
Homepage = "https://github.com/sundonglai03/ssh-tool"
Repository = "https://github.com/sundonglai03/ssh-tool"
Issues = "https://github.com/sundonglai03/ssh-tool/issues"

[tool.pylint."MESSAGES CONTROL"]
disable = "C0103,C0301,W0703,W0621"
