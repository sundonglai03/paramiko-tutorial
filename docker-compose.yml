services:
  ssh-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ssh-mcp-data:/data
      - ./work:/work
      # Optional for key authentication:
      # - ${HOME}/.ssh:/root/.ssh:ro
      # The same read-only mount supplies known_hosts for strict host-key checks.
    environment:
      - SSH_MCP_AUTH_TOKEN
    # Put an authenticated TLS reverse proxy in front before remote access.

volumes:
  ssh-mcp-data:
